name: Release

# Pushing a tag such as 0.2.0 publishes a GitHub Release for it, which is what
# HACS compares against to offer updates. The tag must equal the version in
# manifest.json, otherwise HACS shows one number and Home Assistant another.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that manifest.json carries the tagged version
        run: |
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/flexit_aura/manifest.json'))['version'])")
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json says $manifest but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
