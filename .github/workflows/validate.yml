name: Validate

# There is deliberately no hacs/action job here. That action fetches hacs.json
# and manifest.json from raw.githubusercontent.com without a token, which
# returns 404 for a private repository, so its hacsjson and integration_manifest
# checks can never pass while this repo is private. Its remaining checks
# (topics, license, description) are HACS store admission rules that do not
# apply to installing from a custom repository. Re-add it if the repo goes
# public. hassfest below validates manifest.json far more strictly anyway.

on:
  push:
  pull_request:
  schedule:
    # Catches breakage from new Home Assistant releases rather than from commits.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest pytest-asyncio pyflakes
      - run: python -m pyflakes custom_components/flexit_aura scripts tests
      - run: python -m pytest -q
