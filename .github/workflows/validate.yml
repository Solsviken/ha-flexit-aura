name: Validate

on:
  push:
  pull_request:
  schedule:
    # Catches breakage from new Home Assistant releases rather than from commits.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # No brand icons submitted upstream for a custom integration.
          ignore: brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest pytest-asyncio pyflakes
      - run: python -m pyflakes custom_components/flexit_aura scripts tests
      - run: python -m pytest -q
